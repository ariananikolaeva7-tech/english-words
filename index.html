let state = { records: {}, tick: 0, levels: ['A1','A2','B1'], unknownOnly: false, dark: false };
let storageWarning = false;
try { const saved = JSON.parse(localStorage.getItem(KEY) || 'null'); if (saved && typeof saved === 'object') state = { ...state, ...saved, records: saved.records || {} }; } catch (_) { storageWarning = true; }
if (!Array.isArray(state.levels)) state.levels = ['A1','A2','B1'];

function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); storageWarning = false; } catch (_) { storageWarning = true; } }
function selected(i) { return state.levels.includes(WORDS[i].level); }
function due(i) { const r = record(i); return state.unknownOnly ? !!r && r.status === 'unknown' && !reviewed.has(i) : !r || (r.status === 'known' && r.due <= today()); }
function eligible(i) { return due(i); }
function candidates(predicate) { const out = []; for (let i=0; i<WORDS.length; i++) if (selected(i) && predicate(i)) out.push(i); return out; }
function choose(allowEarly = false) {
 let pool = candidates(eligible);
 if (!pool.length && allowEarly) pool.push(...candidates(due));
 current = pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
 revealed = false; render();
}
function render() {
 document.body.classList.toggle('dark', !!state.dark);
 $('theme').textContent = state.dark ? '☀ Светлая' : '◐ Тёмная';
 for (const el of levelInputs) el.checked = state.levels.includes(el.value);
 $('unknownOnly').checked = !!state.unknownOnly;
 const indices = candidates(() => true);
 $('knownCount').textContent = indices.filter(i => record(i)?.status === 'known').length;
 $('unknownCount').textContent = indices.filter(i => record(i)?.status === 'unknown').length;
 $('remainingCount').textContent = indices.filter(due).length;
 const has = current !== null;
 $('card').disabled = !has; $('known').disabled = !has; $('unknown').disabled = !has;
 $('level').textContent = has ? WORDS[current].level : '';
 $('word').textContent = has ? WORDS[current].en : (!state.levels.length ? 'Выберите уровень' : 'На сегодня всё');
 $('translation').textContent = has ? WORDS[current].ru : '';
 $('translation').hidden = !has || !revealed;
 $('hint').hidden = !has || revealed;
 $('card').setAttribute('aria-label', has ? (revealed ? `${WORDS[current].en}: ${WORDS[current].ru}` : `${WORDS[current].en}. Показать перевод`) : 'Нет карточек');
 const waiting = !has && candidates(due).length > 0;
 $('early').hidden = !waiting;
 let msg = waiting ? 'Для повтора нужно ещё несколько других карточек. Можно повторить раньше.' : (!has && state.levels.length ? (state.unknownOnly ? 'На этот раз все отложенные слова просмотрены. Чтобы пройти их ещё раз, выключите и снова включите режим изучения.' : 'Новые проверки появятся в следующие дни.') : '');
 if (storageWarning) msg += (msg ? ' ' : '') + 'Не удалось сохранить прогресс в браузере.';
 $('message').textContent = msg;
}
function answer(known) {
 if (current === null) return;
 const previous = record(current) || {}; const day = today(); state.tick++;
 if (state.unknownOnly) reviewed.add(current);
 if (known) {
   const streak = previous.lastKnownDay === day ? (previous.streak || 1) : (previous.streak || 0) + 1;
   const intervals = [1, 3, 7, 14, 30, 60, 120];
   state.records[current] = { status:'known', streak, lastKnownDay:day, due:day + intervals[Math.min(streak - 1, intervals.length - 1)] };
 } else {
   state.records[current] = { status:'unknown', streak:0, lastKnownDay:null };
 }
 save(); choose();
}
$('card').addEventListener('click', () => { if (current !== null) { revealed = !revealed; render(); } });
$('known').addEventListener('click', () => answer(true));
$('unknown').addEventListener('click', () => answer(false));
$('early').addEventListener('click', () => choose(true));
$('theme').addEventListener('click', () => { state.dark = !state.dark; save(); render(); });
for (const el of levelInputs) el.addEventListener('change', () => { state.levels = levelInputs.filter(x => x.checked).map(x => x.value); save(); choose(); });
$('unknownOnly').addEventListener('change', e => { state.unknownOnly = e.target.checked; reviewed.clear(); save(); choose(); });
document.addEventListener('keydown', e => { if (e.altKey || e.ctrlKey || e.metaKey || e.repeat) return; const tag = document.activeElement?.tagName; if (tag === 'INPUT' || tag === 'BUTTON') { if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return; } if (e.key === 'ArrowLeft') { e.preventDefault(); answer(false); } else if (e.key === 'ArrowRight') { e.preventDefault(); answer(true); } else if ((e.key === ' ' || e.key === 'Enter') && current !== null) { e.preventDefault(); revealed = !revealed; render(); } });
choose();
</script></body></html>
